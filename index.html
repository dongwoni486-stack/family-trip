function setupMyLocation(){
  const btn = document.getElementById('myLocBtn');
  if(!navigator.geolocation){
    btn.style.display = 'none';
    return;
  }
  const updatePos = (pos)=>{
    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if(!myLocMarker){
      myLocMarker = new google.maps.Marker({
        position: p, map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE, scale: 8,
          fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2
        },
        zIndex: 999, title: '내 위치'
      });
    } else {
      myLocMarker.setPosition(p);
    }
  };
  btn.addEventListener('click', ()=>{
    navigator.geolocation.getCurrentPosition((pos)=>{
      updatePos(pos);
      map.panTo({lat: pos.coords.latitude, lng: pos.coords.longitude});
      map.setZoom(15);
    }, ()=>{ alert('위치 권한을 허용해주세요.'); }, {enableHighAccuracy:true});
    if(myLocWatchId === null){
      myLocWatchId = navigator.geolocation.watchPosition(updatePos, ()=>{}, {enableHighAccuracy:true});
    }
  });
}

function escapeHtml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function isSafeUrl(url) {
  try { const u = new URL(url); return u.protocol === 'http:' || u.protocol === 'https:'; } catch { return false; }
}

function initMap(){
  map = new google.maps.Map(document.getElementById('map'), { center: {lat:35.0, lng:135.0}, zoom:9, disableDefaultUI:true });
  setupMyLocation();
  renderAll();
}

async function fetchWeather(lat, lng) {
  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
    const data = await res.json();
    const w = data.current_weather;
    let icon = '☀️/☁️ 맑음';
    if(w.weathercode > 3 && w.weathercode <= 48) icon = '🌫️ 안개';
    else if(w.weathercode >= 51 && w.weathercode <= 67) icon = '🌧️ 비';
    else if(w.weathercode >= 71 && w.weathercode <= 77) icon = '❄️ 눈';
    else if(w.weathercode >= 80 && w.weathercode <= 82) icon = '🌦️ 소나기';
    else if(w.weathercode >= 95) icon = '⛈️ 뇌우';

    document.getElementById('weather').innerHTML = `${icon} <span class="weather-temp">${w.temperature}°C</span>`;
  } catch(e) {
    document.getElementById('weather').innerHTML = '날씨 정보 없음';
  }
}

function renderLegPicker(dayIdx, i, legData){
  const lk = `${dayIdx}-${i}`;
  const available = legData ? Object.keys(legData).filter(m => legData[m]) : [];
  if(available.length === 0){
    return `<div class="leg-picker"><span class="leg-info">🚶 구간 정보 미동기화 (다음 자동 동기화 시 반영)</span></div>`;
  }
  const picked = legPicks[lk] && available.includes(legPicks[lk]) ? legPicks[lk] : available[0];
  const buttons = ['walking','transit','driving'].map(m=>{
    const has = available.includes(m);
    return `<button type="button" class="leg-mode ${picked===m?'active':''}" data-legkey="${lk}" data-mode="${m}" ${has?'':'disabled'}>${MODE_LABEL[m]}</button>`;
  }).join('');
  const info = legData[picked] ? `<span class="leg-info">${legData[picked].duration} · ${legData[picked].distance}</span>` : '';
  return `<div class="leg-picker">${buttons}${info}</div>`;
}

/* ===== 렌더링 ===== */
function renderAll(){
  if(!itinerary || !itinerary.length || !map) return;
  const day = itinerary[activeDay];

  const tabsEl = document.getElementById('dayTabs');
  tabsEl.innerHTML = itinerary.map((d,i)=>
    `<div class="day-tab ${i===activeDay?'active':''}" data-day="${i}">${escapeHtml(d.dayLabel)}</div>`
  ).join('');
  tabsEl.querySelectorAll('.day-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ activeDay = +el.dataset.day; renderAll(); });
  });

  document.getElementById('sumTitle').textContent = `📅 ${day.dayLabel} 상세 일정`;

  const checkSec = document.getElementById('checklistSection');
  if(day.checklist && day.checklist.length > 0) {
    checkSec.style.display = 'block';
    let cHtml = `<div class="checklist-title">🎒 오늘의 준비물</div>`;
    day.checklist.forEach((item) => {
      const isD = packChecked[`pack-${day.dayLabel}-${item}`];
      cHtml += `<div class="check-item ${isD?'done':''}" data-pack="${escapeHtml(item)}">${isD?'☑':'☐'} ${escapeHtml(item)}</div>`;
    });
    checkSec.innerHTML = cHtml;
    checkSec.querySelectorAll('[data-pack]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const k = `pack-${day.dayLabel}-${el.dataset.pack}`;
        packChecked[k] = !packChecked[k];
        localStorage.setItem('trip-pack', JSON.stringify(packChecked));
        renderAll();
      });
    });
  } else {
    checkSec.style.display = 'none';
  }

  let html = "";
  day.stops.forEach((s, i)=>{
    const k = `${activeDay}-${i}`;
    const isDone = checked[k];

    const targetQuery = s.place ? s.place : s.title;
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(targetQuery)}`;
    let btnHtml = `<div class="btn-group"><a href="${escapeHtml(mapUrl)}" target="_blank" rel="noopener noreferrer" class="action-btn map-btn" data-stop-btn>🗺️ 구글맵 안내</a>`;
    if(isSafeUrl(s.url)) {
      btnHtml += `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" class="action-btn ticket-btn" data-stop-btn>🎫 바우처 열기</a>`;
    }
    btnHtml += `</div>`;

    let candHtml = "";
    if(s.candidates) {
      candHtml = s.candidates.map((c, ci) => {
        const ck = `meal-${k}`;
        const isSel = mealPicks[ck] === ci;
        return `<div class="cand-chip ${isSel?'selected':''}" data-cand="${ck}" data-ci="${ci}">
          <div><b>${escapeHtml(c.name)}</b></div><div>${isSel?'✅':'○'}</div>
        </div>`;
      }).join('');
    }

    html += `
      <div class="stop ${isDone?'done':''}" data-stop="${k}">
        <div class="stop-line"><div class="stop-dot"></div><div class="stop-connector"></div></div>
        <div class="stop-card" data-stop-card="${k}">
          <div class="stop-time">${escapeHtml(s.time)}</div>
          ${s.title ? `<div class="stop-title">${escapeHtml(s.title)}</div>` : ""}
          ${s.place ? `<div class="stop-place">📍 ${escapeHtml(s.place)}</div>` : ""}
          ${s.desc ? `<div class="stop-desc">${escapeHtml(s.desc)}</div>` : ""}
          ${candHtml}
          ${btnHtml}
        </div>
      </div>`;
    if(i < day.stops.length - 1){
      html += renderLegPicker(activeDay, i, day.legs && day.legs[i]);
    }
  });
  const timelineEl = document.getElementById('timeline');
  timelineEl.innerHTML = html;

  timelineEl.querySelectorAll('[data-stop-card]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-cand], [data-stop-btn]')) return;
      const k = card.dataset.stopCard;
      checked[k] = !checked[k];
      localStorage.setItem('trip-checked', JSON.stringify(checked));
      renderAll();
    });
  });
  timelineEl.querySelectorAll('[data-cand]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      e.stopPropagation();
      const ck = chip.dataset.cand;
      const ci = +chip.dataset.ci;
      mealPicks[ck] = (mealPicks[ck] === ci) ? null : ci;
      localStorage.setItem('trip-meals', JSON.stringify(mealPicks));
      renderAll();
    });
  });
  timelineEl.querySelectorAll('.leg-mode').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.disabled) return;
      const lk = btn.dataset.legkey;
      legPicks[lk] = btn.dataset.mode;
      localStorage.setItem('trip-legmode', JSON.stringify(legPicks));
      renderAll();
    });
  });

  gOverlays.forEach(o=>o.setMap(null)); gOverlays = [];
  const bounds = new google.maps.LatLngBounds();
  const pathCoords = [];

  day.stops.forEach((s,i)=>{
    if(Number.isFinite(s.lat) && Number.isFinite(s.lng)){
      const pos = {lat:s.lat, lng:s.lng};
      pathCoords.push(pos);
      bounds.extend(pos);
      gOverlays.push(new google.maps.Marker({position:pos, map, label:{text:String(i+1), color:'white'}}));
    } else {
      pathCoords.push(null);
    }
  });

  for(let i=0; i<pathCoords.length-1; i++){
    const a = pathCoords[i], b = pathCoords[i+1];
    if(!a || !b) continue;
    const lk = `${activeDay}-${i}`;
    const legData = day.legs && day.legs[i];
    const available = legData ? Object.keys(legData).filter(m => legData[m]) : [];
    const picked = legPicks[lk] && available.includes(legPicks[lk]) ? legPicks[lk] : available[0];
    if(picked && legData[picked] && legData[picked].poly && google.maps.geometry){
      const path = google.maps.geometry.encoding.decodePath(legData[picked].poly);
      gOverlays.push(new google.maps.Polyline({ path, map, strokeColor:'#BE4A3C', strokeOpacity:0.75, strokeWeight:4 }));
    } else {
      gOverlays.push(new google.maps.Polyline({
        path:[a,b], map, strokeOpacity:0,
        icons:[{icon:{path:'M 0,-1 0,1', strokeOpacity:.6, scale:3, strokeColor:'#BE4A3C'}, offset:'0', repeat:'10px'}]
      }));
    }
  }

  if(day.stops.length > 0 && !bounds.isEmpty()) map.fitBounds(bounds);
  const firstValid = pathCoords.find(Boolean);
  if(firstValid) fetchWeather(firstValid.lat, firstValid.lng);
}
</script>
