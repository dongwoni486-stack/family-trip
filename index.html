<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오사카·교토 가족 여행 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1F2A44; --vermillion:#BE4A3C; --moss:#5B7553; --paper:#F6F1E7; --paper-2:#FFFFFF; --line:#E4DACB; --muted:#8A8071; --gold:#C9A24B; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; padding-bottom:40px; }

  .sticky-top { position: sticky; top: 0; z-index: 100; background: var(--paper); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  header{ background:var(--ink); color:var(--paper); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1{font-family:'Noto Serif KR', serif; font-size:15px; margin:0; font-weight:500;}
  .weather-widget { text-align:right; font-size:11px; color:#C8CEDB; cursor:pointer; user-select:none; }
  .weather-widget::after{ content:' ▾'; font-size:9px; opacity:.7; }
  .weather-widget.open::after{ content:' ▴'; }
  .weather-temp { font-size:15px; font-weight:700; color:#fff; }

  .info-bar{ display:flex; justify-content:space-between; padding:5px 18px; background:#2A3652; color:#C8CEDB; font-size:10.5px; }
  .hourly-weather{ display:flex; gap:0; overflow-x:auto; background:#233052; padding:5px 10px; scrollbar-width:none; }
  .hourly-weather::-webkit-scrollbar{ display:none; }
  .hourly-item{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:1px; padding:0 7px; color:#C8CEDB; font-size:9px; border-right:1px solid #3A4763; line-height:1.3; }
  .hourly-item:last-child{ border-right:none; }
  .hourly-item .hr-time{ font-size:8px; opacity:.8; }
  .hourly-item .hr-icon{ font-size:11px; }
  .hourly-item .hr-temp{ font-size:9.5px; font-weight:700; color:#fff; }
  .hourly-item .hr-pop{ font-size:7.5px; color:#8FB4E8; }
  .hourly-item.rainy .hr-pop{ color:#FFB74D; font-weight:700; }
  .hourly-item.rainy{ background:rgba(255,183,77,0.08); }
  .rain-note{ display:none; padding:5px 16px; background:#3A2A1A; color:#FFB74D; font-size:10px; font-weight:500; }

  .day-tabs{ display:flex; gap:8px; overflow-x:auto; padding:10px 14px; background:var(--ink); scrollbar-width:none; }
  .day-tab{ padding:8px 14px; border-radius:20px; border:1px solid #3A4763; background:#2A3652; color:#C8CEDB; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .day-tab.active{background:var(--vermillion); border-color:var(--vermillion); color:#fff;}

  #map{ height:260px; width:100%; border-bottom:1px solid var(--line);}
  @media (max-width: 600px) { #map { height: 230px; } }
  .summary-bar{ padding:10px 18px; background:var(--paper-2); font-size:13px; font-weight:700; color:var(--ink); border-bottom:1px solid var(--line); }

  .checklist-wrap { background:#EEF3E9; padding:10px 16px; border-bottom:1px solid var(--line); font-size:12px; }
  .checklist-title { font-weight:700; color:var(--moss); margin-bottom:4px; }
  .checklist-progress { font-weight:500; font-size:11px; color:var(--muted); }
  .check-item { display:inline-flex; align-items:center; gap:4px; margin-right:10px; margin-bottom:4px; cursor:pointer; color:#444;}
  .check-item.done { text-decoration:line-through; color:var(--muted); opacity:0.6; }

  main{padding:16px;}
  .stop{ position:relative; display:flex; gap:12px; margin-bottom:4px;}
  .stop-line{ display:flex; flex-direction:column; align-items:center; width:28px; }
  .stop-dot{ width:20px; height:20px; border-radius:50%; background:var(--vermillion); border:2px solid var(--vermillion); margin-top:2px; z-index:2; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; }
  .stop.done .stop-dot{background:var(--moss); border-color:var(--moss);}
  .stop-connector{ width:2px; flex:1; background:repeating-linear-gradient(to bottom, var(--line) 0 4px, transparent 4px 8px); min-height:20px;}

  .stop-card{ flex:1; background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:12px; cursor:pointer; }
  .stop.done .stop-card{opacity:.55;}
  .stop-time{font-size:12px; color:var(--vermillion); font-weight:700;}
  .stop-title{font-size:16.5px; font-weight:700; margin:3px 0 3px;}
  .stop-place{font-size:13.5px; font-weight:500; color:var(--moss); margin-bottom:5px;}
  .stop-desc{font-size:13.5px; color:#5B5647; line-height:1.5; margin-bottom:7px;}
  .res-box{ display:inline-block; background:#FFF4E5; border:1px solid #F0D9A8; color:#8A6100; font-size:12px; font-weight:700; padding:5px 9px; border-radius:7px; margin-bottom:6px; }
  .info-detail{ display:inline-block; font-size:12.5px; color:#5B5647; margin-bottom:6px; }
  .info-phone{ color:#4285F4; text-decoration:none; font-weight:600; }

  .btn-group { display:flex; gap:6px; margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
  .action-btn { display:inline-block; padding:6px 10px; background:var(--paper); border:1px solid var(--line); border-radius:6px; font-size:12px; text-decoration:none; font-weight:500; }
  .action-btn.map-btn { color:#4285F4; border-color:#D2E3FC; background:#E8F0FE; }
  .action-btn.copy-btn { color:var(--moss); border-color:#DCE8D6; background:#EEF3E9; cursor:pointer; font-family:'Noto Sans KR', sans-serif; }
  .action-btn.copy-btn.copied { background:var(--moss); color:#fff; border-color:var(--moss); }
  .action-btn.next-btn { color:#7A4FBE; border-color:#E4D9F5; background:#F3EDFB; }

  .cand-chip{ display:flex; justify-content:space-between; padding:7px 9px; border-radius:8px; border:1px solid var(--line); font-size:11.5px; background:var(--paper); margin-top:4px;}
  .cand-map-link{ text-decoration:none; font-size:11px; }
  .cand-chip.selected{ border-color:var(--moss); background:#EEF3E9;}

  .leg-picker{ display:flex; align-items:center; gap:6px; margin:-2px 0 12px 40px; flex-wrap:wrap; }
  .leg-mode{ border:1px solid var(--line); background:var(--paper-2); color:var(--muted); border-radius:14px; padding:4px 10px; font-size:11px; cursor:pointer; font-family:'Noto Sans KR', sans-serif; }
  .leg-mode.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .leg-mode:disabled{ opacity:.35; cursor:default; }
  .leg-info{ font-size:11px; color:var(--muted); }

  .my-loc-btn{ position:absolute; right:10px; bottom:10px; z-index:5; background:#fff; border:1px solid var(--line); border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.2); cursor:pointer; font-size:16px; }
  #mapWrap{ position:relative; }

  .mode-tabs{ display:flex; background:var(--ink); padding:0 14px; }
  .mode-tab{ padding:9px 12px; font-size:12.5px; color:#8894AC; cursor:pointer; border-bottom:2px solid transparent; }
  .mode-tab.active{ color:#fff; border-bottom-color:var(--vermillion); font-weight:700; }

  .ref-filters{ padding:8px 0 8px 14px; background:var(--paper-2); border-bottom:1px solid var(--line); display:block; }
  .ref-cat-row{ display:flex; gap:6px; flex-wrap:wrap; padding-right:14px; margin-bottom:6px; align-items:flex-start; }
  .ref-region-row{ display:flex; gap:5px; overflow-x:auto; padding-right:14px; scrollbar-width:none; white-space:nowrap; align-items:flex-start; }
  .ref-region-row::-webkit-scrollbar{ display:none; }
  .ref-region-row .ref-chip{ flex:0 0 auto; align-self:flex-start; }
  .ref-chip.ref-chip-sm{ padding:4px 8px; font-size:10px; border-radius:11px; }
  .ref-chip{ padding:6px 11px; border-radius:14px; border:1px solid var(--line); background:var(--paper); font-size:11.5px; cursor:pointer; color:#5B5647; }
  .ref-chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .ref-group-title{ font-size:13px; font-weight:700; color:var(--ink); margin:18px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .ref-group-title:first-child{ margin-top:2px; }
  .ref-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:8px; }
  .ref-card .cat{ font-size:11px; color:var(--vermillion); font-weight:700; }
  .ref-card .name{ font-size:15.5px; font-weight:700; margin:3px 0 4px; }
  .ref-card .note{ font-size:13px; color:#5B5647; line-height:1.5; margin-bottom:8px; }
  .ref-card .rlink{ display:inline-block; padding:5px 9px; background:#E8F0FE; color:#4285F4; border:1px solid #D2E3FC; border-radius:6px; font-size:11px; text-decoration:none; font-weight:500; }

  footer{ text-align:center; padding:18px 16px 6px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>

<div class="sticky-top">
  <header>
    <h1>오사카·교토 가족 여행 가이드</h1>
    <div class="weather-widget" id="weather" role="button">날씨 확인 중...</div>
  </header>
  <div class="info-bar" id="infoBar">
    <span id="localTime">🕒 --:--</span>
    <span id="fxRate">💴 100엔 = -- 원</span>
  </div>
  <div class="hourly-weather" id="hourlyWeather" style="display:none;"></div>
  <div class="rain-note" id="rainNote"></div>
  <div class="mode-tabs" id="modeTabs">
    <div class="mode-tab active" data-mode="itinerary">📅 일정</div>
    <div class="mode-tab" data-mode="ref">📍 맛집·쇼핑·관광</div>
  </div>
  <nav class="day-tabs" id="dayTabs"></nav>
  <div id="mapWrap">
    <div id="map"></div>
    <button type="button" class="my-loc-btn" id="myLocBtn" title="내 위치">📍</button>
  </div>
  <div class="summary-bar" id="sumTitle">일정</div>
  <div class="checklist-wrap" id="checklistSection" style="display:none;"></div>
  <div class="ref-filters" id="refFilters" style="display:none;"></div>
  <div id="refMapWrap" style="display:none; position:relative;">
    <div id="refMap" style="height:220px; width:100%; border-bottom:1px solid var(--line);"></div>
    <button type="button" class="my-loc-btn" id="refMyLocBtn" title="내 위치">📍</button>
  </div>
  <div id="refMapNote" style="display:none; font-size:11px; color:var(--muted); padding:4px 14px; background:var(--paper-2);"></div>
</div>

<main>
  <div id="timeline"></div>
  <div id="refList" style="display:none;"></div>
</main>

<footer>구글 스프레드시트 기반 · 완료 체크·준비물·식당 선택은 이 브라우저에만 저장됩니다</footer>

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let refMapInstance = null;
let refMapOverlays = [];

function renderRefMap(items){
  const withCoords = items.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  const mapEl = document.getElementById('refMap');
  const noteEl = document.getElementById('refMapNote');

  if(withCoords.length === 0){
    mapEl.innerHTML = '<div style="padding:14px;font-size:12px;color:var(--muted);">이 목록은 아직 좌표가 준비되지 않았습니다 (다음 자동 동기화 후 지도에 표시됩니다). 아래 목록의 "지도에서 보기"는 계속 사용하실 수 있습니다.</div>';
    noteEl.style.display = 'none';
    return;
  }

  if(!refMapInstance){
    mapEl.innerHTML = '';
    refMapInstance = new google.maps.Map(mapEl, { center:{lat:35.0,lng:135.0}, zoom:9, disableDefaultUI:true });
  }
  refMapOverlays.forEach(o=>o.setMap(null));
  refMapOverlays = [];

  const bounds = new google.maps.LatLngBounds();
  const infoWin = new google.maps.InfoWindow();
  withCoords.forEach(x=>{
    const pos = {lat:x.lat, lng:x.lng};
    bounds.extend(pos);
    const marker = new google.maps.Marker({
      position: pos, map: refMapInstance,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale:7, fillColor: x.type==='food'?'#BE4A3C':(x.type==='shop'?'#4285F4':'#C9A24B'), fillOpacity:1, strokeColor:'#fff', strokeWeight:2 }
    });
    marker.addListener('click', ()=>{
      infoWin.setContent(`<div style="font-size:12px;"><b>${escapeHtml(x.name)}</b><br>${escapeHtml(x.cat)}</div>`);
      infoWin.open(refMapInstance, marker);
    });
    refMapOverlays.push(marker);
  });
  if(withCoords.length === 1){ refMapInstance.setCenter(bounds.getCenter()); refMapInstance.setZoom(15); }
  else refMapInstance.fitBounds(bounds, 30);

  if(withCoords.length < items.length){
    noteEl.textContent = `일부 ${items.length - withCoords.length}곳은 좌표 준비 중이라 지도에는 안 뜹니다 (목록에서 확인 가능)`;
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }
}

function mapsSearchUrl(name){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
}

function setMode(mode){
  appMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===mode));
  const showItinerary = mode === 'itinerary';
  const showRef = mode === 'ref';

  document.getElementById('dayTabs').style.display = showItinerary ? '' : 'none';
  document.getElementById('mapWrap').style.display = showItinerary ? '' : 'none';
  document.getElementById('checklistSection').style.display = showItinerary && document.getElementById('checklistSection').dataset.hasItems === '1' ? 'block' : 'none';
  document.getElementById('timeline').style.display = showItinerary ? '' : 'none';

  document.getElementById('refFilters').style.display = showRef ? 'flex' : 'none';
  document.getElementById('refMapWrap').style.display = showRef ? 'block' : 'none';
  if(!showRef) document.getElementById('refMapNote').style.display = 'none';
  document.getElementById('refList').style.display = showRef ? '' : 'none';

  document.getElementById('sumTitle').textContent = showItinerary
    ? `📅 ${itinerary[activeDay].dayLabel} 상세 일정`
    : '📍 근처 맛집·쇼핑·관광 모음';

  if(showRef) renderRef();
}
document.querySelectorAll('.mode-tab').forEach(t=>{
  t.addEventListener('click', ()=> setMode(t.dataset.mode));
});

document.getElementById('weather').addEventListener('click', ()=>{
  const el = document.getElementById('weather');
  const hourlyEl = document.getElementById('hourlyWeather');
  const willOpen = hourlyEl.style.display !== 'flex';
  hourlyEl.style.display = willOpen ? 'flex' : 'none';
  el.classList.toggle('open', willOpen);
});

function renderRef(){
  const all = [...refData.food.map(x=>({...x,type:'food'})), ...refData.shop.map(x=>({...x,type:'shop'})), ...refData.sight.map(x=>({...x,type:'sight'}))];
  const byCat = refCategory === 'all' ? all : all.filter(x=>x.type===refCategory);
  const regions = [...new Set(byCat.map(x=>x.region))];
  if(refRegion !== 'all' && !regions.includes(refRegion)) refRegion = 'all';

  const catChips = ['all','food','shop','sight'].map(c=>{
    const isActive = refCategory===c;
    const color = CAT_COLOR[c];
    let style = '';
    if(color){
      style = isActive
        ? ` style="background:${color};border-color:${color};color:#fff;"`
        : ` style="background:${hexToRgba(color,0.12)};border-color:${hexToRgba(color,0.35)};color:${color};"`;
    } else if(isActive){
      style = '';
    }
    return `<div class="ref-chip ${isActive?'active':''}" data-refcat="${c}"${style}>${c==='all'?'전체':CAT_LABEL[c]}</div>`;
  }).join('');
  const regionChips = ['all', ...regions].map(r=>
    `<div class="ref-chip ref-chip-sm ${refRegion===r?'active':''}" data-refregion="${escapeHtml(r)}">${r==='all'?'전체지역':escapeHtml(r)}</div>`
  ).join('');
  const filtersEl = document.getElementById('refFilters');
  filtersEl.innerHTML = `<div class="ref-cat-row">${catChips}</div><div class="ref-region-row">${regionChips}</div>`;
  filtersEl.querySelectorAll('[data-refcat]').forEach(el=>{
    el.addEventListener('click', ()=>{ refCategory = el.dataset.refcat; refRegion='all'; renderRef(); });
  });
  filtersEl.querySelectorAll('[data-refregion]').forEach(el=>{
    el.addEventListener('click', ()=>{ refRegion = el.dataset.refregion; renderRef(); });
  });

  const shown = byCat.filter(x => refRegion==='all' || x.region===refRegion);
  const grouped = {};
  shown.forEach(x=>{ (grouped[x.region] = grouped[x.region] || []).push(x); });

  renderRefMap(shown);

  let html = '';
  Object.keys(grouped).forEach(region=>{
    html += `<div class="ref-group-title">${escapeHtml(region)}</div>`;
    grouped[region].forEach(x=>{
      html += `
        <div class="ref-card">
          <div class="cat" style="color:${CAT_COLOR[x.type] || 'var(--vermillion)'}">${CAT_LABEL[x.type]} · ${escapeHtml(x.cat)}</div>
          <div class="name">${escapeHtml(x.name)}</div>
          <div class="note">${escapeHtml(x.note)}</div>
          <a class="rlink" href="${escapeHtml(mapsSearchUrl(x.name))}" target="_blank" rel="noopener noreferrer">🗺️ 지도에서 보기</a>
        </div>`;
    });
  });
  document.getElementById('refList').innerHTML = html || '<p style="color:var(--muted);font-size:13px;">해당 조건의 장소가 없습니다.</p>';
}

const MODE_LABEL = { walking: '🚶 도보', train: '🚆 기차', bus: '🚌 버스', driving: '🚕 택시' };

function createLocationButton(btnId, getMap){
  const btn = document.getElementById(btnId);
  if(!navigator.geolocation){
    btn.style.display = 'none';
    return;
  }
  let marker = null;
  let watchId = null;
  const updatePos = (pos)=>{
    const m = getMap();
    if(!m) return;
    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if(!marker){
      marker = new google.maps.Marker({
        position: p, map: m,
        icon: {
          path: google.maps.SymbolPath.CIRCLE, scale: 8,
          fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2
        },
        zIndex: 999, title: '내 위치'
      });
    } else {
      marker.setMap(m);
      marker.setPosition(p);
    }
  };
  btn.addEventListener('click', ()=>{
    const m = getMap();
    if(!m){ alert('지도가 아직 준비되지 않았습니다. 잠시 후 다시 눌러주세요.'); return; }
    navigator.geolocation.getCurrentPosition((pos)=>{
      updatePos(pos);
      m.panTo({lat: pos.coords.latitude, lng: pos.coords.longitude});
      m.setZoom(15);
    }, ()=>{ alert('위치 권한을 허용해주세요.'); }, {enableHighAccuracy:true});
    if(watchId === null){
      watchId = navigator.geolocation.watchPosition(updatePos, ()=>{}, {enableHighAccuracy:true});
    }
  });
}

function setupMyLocation(){
  createLocationButton('myLocBtn', ()=>map);
  createLocationButton('refMyLocBtn', ()=>refMapInstance);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function isSafeUrl(url) {
  try { const u = new URL(url); return u.protocol === 'http:' || u.protocol === 'https:'; } catch { return false; }
}

function initMap(){
  map = new google.maps.Map(document.getElementById('map'), { center: {lat:35.0, lng:135.0}, zoom:9, disableDefaultUI:true });
  setupMyLocation();
  renderAll();
  startLocalClock();
  fetchExchangeRate();
}

function startLocalClock(){
  const update = ()=>{
    const now = new Date();
    const jpTime = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(now);
    document.getElementById('localTime').textContent = `🕒 일본 현지시간 ${jpTime}`;
  };
  update();
  setInterval(update, 30000);
}

async function fetchExchangeRate(){
  const el = document.getElementById('fxRate');
  el.textContent = '💴 환율 확인 중...';
  // 1차: Frankfurter (ECB 공식)
  try {
    const res = await fetch('https://api.frankfurter.app/latest?from=JPY&to=KRW');
    const data = await res.json();
    const rate = data.rates && data.rates.KRW;
    if(!rate) throw new Error('no rate');
    el.textContent = `💴 100엔 ≈ ${(rate*100).toFixed(1)}원`;
    return;
  } catch(e) { /* 다음 시도 */ }
  // 2차: 대체 무료 API
  try {
    const res2 = await fetch('https://open.er-api.com/v6/latest/JPY');
    const data2 = await res2.json();
    const rate2 = data2.rates && data2.rates.KRW;
    if(!rate2) throw new Error('no rate2');
    el.textContent = `💴 100엔 ≈ ${(rate2*100).toFixed(1)}원`;
    return;
  } catch(e2) {
    el.textContent = '💴 환율 준비 중';
  }
}

function weatherIcon(code){
  if(code <= 3) return '☀️';
  if(code > 3 && code <= 48) return '🌫️';
  if(code >= 51 && code <= 67) return '🌧️';
  if(code >= 71 && code <= 77) return '❄️';
  if(code >= 80 && code <= 82) return '🌦️';
  if(code >= 95) return '⛈️';
  return '🌤️';
}

const TRIP_YEAR = 2026; // 다음 여행에 재사용할 때는 이 연도만 바꾸면 됩니다

function getDayDateStr(dayLabel){
  const m = (dayLabel||'').match(/\((\d{1,2})\/(\d{1,2})\)/);
  if(!m) return null;
  const month = m[1].padStart(2,'0');
  const day = m[2].padStart(2,'0');
  return `${TRIP_YEAR}-${month}-${day}`;
}

async function fetchWeather(lat, lng, targetDateStr) {
  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;
  try {
    // 오늘부터 그 날짜까지 며칠 남았는지 계산해서, 딱 그만큼만 예보를 받아옵니다
    const todayStr = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Tokyo'}).format(new Date());
    let forecastDays = 2;
    if(targetDateStr){
      const diffDays = Math.round((new Date(targetDateStr) - new Date(todayStr)) / 86400000);
      forecastDays = Math.max(1, Math.min(16, diffDays + 1));
    }
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&hourly=temperature_2m,weathercode,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=${forecastDays}`);
    const data = await res.json();
    const w = data.current_weather;
    document.getElementById('weather').innerHTML = `${weatherIcon(w.weathercode)} <span class="weather-temp">${w.temperature}°C</span>`;

    const hourlyEl = document.getElementById('hourlyWeather');
    const dateForHours = targetDateStr || todayStr;
    const isToday = dateForHours === todayStr;

    if(data.hourly && data.hourly.time){
      // 해당 날짜의 06시~23시만 추려서 "그날 하루 전체" 예보로 보여줍니다
      const dayIdxs = [];
      data.hourly.time.forEach((t, idx)=>{
        const [d, h] = [t.slice(0,10), parseInt(t.slice(11,13),10)];
        if(d === dateForHours && h >= 6 && h <= 23) dayIdxs.push(idx);
      });

      if(dayIdxs.length === 0){
        hourlyEl.innerHTML = '<div style="padding:8px 14px;font-size:11px;color:#8fa0c0;">이 날짜는 예보 범위 밖입니다 (여행일이 가까워지면 표시됩니다)</div>';
        document.getElementById('rainNote').style.display = 'none';
      } else {
        const nowHour = isToday ? parseInt(w.time.slice(11,13),10) : -1;
        let html = '';
        let firstRain = null;
        dayIdxs.forEach(idx=>{
          const h = parseInt(data.hourly.time[idx].slice(11,13),10);
          const temp = Math.round(data.hourly.temperature_2m[idx]);
          const code = data.hourly.weathercode[idx];
          const pop = data.hourly.precipitation_probability ? data.hourly.precipitation_probability[idx] : null;
          const rainy = pop !== null && pop >= 30;
          const isNow = h === nowHour;
          if(rainy && firstRain === null) firstRain = isNow ? '지금' : `${h}시`;
          html += `<div class="hourly-item ${rainy?'rainy':''}">
            <div class="hr-time">${isNow?'지금':h+'시'}</div>
            <div class="hr-icon">${weatherIcon(code)}</div>
            <div class="hr-temp">${temp}°</div>
            ${pop!==null ? `<div class="hr-pop">${rainy?'☔':''}${pop}%</div>` : ''}
          </div>`;
        });
        hourlyEl.innerHTML = html;

        const rainNote = document.getElementById('rainNote');
        if(firstRain){
          rainNote.textContent = `☔ ${firstRain}쯤부터 비 올 확률 있음 (강수확률 30%↑)`;
          rainNote.style.display = 'block';
        } else {
          rainNote.style.display = 'none';
        }
      }
      // 기본은 접힌 상태 유지 - 사용자가 날씨 위젯을 눌러야 펼쳐짐
    }
  } catch(e) {
    document.getElementById('weather').innerHTML = '날씨 정보 없음';
  }
}

/* ===== 구간별 이동수단 선택 (사전 계산된 데이터만 사용, 실시간 호출 없음) ===== */
function renderLegPicker(dayIdx, i, legData){
  const lk = `${dayIdx}-${i}`;
  const available = legData ? Object.keys(legData).filter(m => legData[m]) : [];
  if(available.length === 0){
    return ''; // 아직 자동 동기화 전이면 조용히 아무것도 표시하지 않음 (개발자용 문구 숨김)
  }
  const picked = legPicks[lk] && available.includes(legPicks[lk]) ? legPicks[lk] : available[0];
  const buttons = ['walking','train','bus','driving'].map(m=>{
    const has = available.includes(m);
    return `<button type="button" class="leg-mode ${picked===m?'active':''}" data-legkey="${lk}" data-mode="${m}" ${has?'':'disabled'}>${MODE_LABEL[m]}</button>`;
  }).join('');
  const info = legData[picked] ? `<span class="leg-info">${legData[picked].duration} · ${legData[picked].distance}</span>` : '';
  return `<div class="leg-picker">${buttons}${info}</div>`;
}

/* ===== 렌더링 ===== */
function renderAll(){
  if(!itinerary || !itinerary.length || !map) return;
  const day = itinerary[activeDay];

  const tabsEl = document.getElementById('dayTabs');
  tabsEl.innerHTML = itinerary.map((d,i)=>
    `<div class="day-tab ${i===activeDay?'active':''}" data-day="${i}">${escapeHtml(d.dayLabel)}</div>`
  ).join('');
  tabsEl.querySelectorAll('.day-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ activeDay = +el.dataset.day; renderAll(); });
  });

  if(appMode === 'itinerary'){
    document.getElementById('sumTitle').textContent = `📅 ${day.dayLabel} 상세 일정`;
  }

  const checkSec = document.getElementById('checklistSection');
  checkSec.dataset.hasItems = (day.checklist && day.checklist.length > 0) ? '1' : '0';
  if(day.checklist && day.checklist.length > 0) {
    checkSec.style.display = appMode === 'itinerary' ? 'block' : 'none';
    const doneCount = day.checklist.filter(item => packChecked[`pack-${day.dayLabel}-${item}`]).length;
    const totalCount = day.checklist.length;
    const progressLabel = doneCount === totalCount ? '완료 🎉' : `${doneCount}/${totalCount}`;
    let cHtml = `<div class="checklist-title">🎒 오늘의 준비물 <span class="checklist-progress">${progressLabel}</span></div>`;
    day.checklist.forEach((item) => {
      const isD = packChecked[`pack-${day.dayLabel}-${item}`];
      cHtml += `<div class="check-item ${isD?'done':''}" data-pack="${escapeHtml(item)}">${isD?'☑':'☐'} ${escapeHtml(item)}</div>`;
    });
    checkSec.innerHTML = cHtml;
    checkSec.querySelectorAll('[data-pack]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const k = `pack-${day.dayLabel}-${el.dataset.pack}`;
        packChecked[k] = !packChecked[k];
        localStorage.setItem('trip-pack', JSON.stringify(packChecked));
        renderAll();
      });
    });
  } else {
    checkSec.style.display = 'none';
  }

  let html = "";
  day.stops.forEach((s, i)=>{
    const k = `${activeDay}-${i}`;
    const isDone = checked[k];

    const targetQuery = s.place ? s.place : s.title;
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(targetQuery)}`;
    let btnHtml = `<div class="btn-group"><a href="${escapeHtml(mapUrl)}" target="_blank" rel="noopener noreferrer" class="action-btn map-btn" data-stop-btn>🗺️ 구글맵 안내</a>`;
    if(s.place) {
      btnHtml += `<button type="button" class="action-btn copy-btn" data-copy="${escapeHtml(s.place)}" data-stop-btn>📋 주소 복사</button>`;
    }
    if(targetQuery) {
      const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(targetQuery)}`;
      btnHtml += `<a href="${escapeHtml(dirUrl)}" target="_blank" rel="noopener noreferrer" class="action-btn next-btn" data-stop-btn>🚶 여기까지 길찾기</a>`;
    }
    btnHtml += `</div>`;

    let candHtml = "";
    if(s.candidates) {
      candHtml = s.candidates.map((c, ci) => {
        const ck = `meal-${k}`;
        const isSel = mealPicks[ck] === ci;
        const candMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.name)}`;
        return `<div class="cand-chip ${isSel?'selected':''}" data-cand="${ck}" data-ci="${ci}">
          <div><b>${escapeHtml(c.name)}</b> <a href="${escapeHtml(candMapUrl)}" target="_blank" rel="noopener noreferrer" class="cand-map-link" onclick="event.stopPropagation()">🗺️</a></div><div>${isSel?'✅':'○'}</div>
        </div>`;
      }).join('');
    }

    let resHtml = "";
    const resMatch = (s.desc||'').match(/예약\s*번호\s*[:\s]*([A-Za-z0-9]{4,})/);
    if(resMatch) {
      resHtml = `<div class="res-box">🎫 예약번호 <b>${escapeHtml(resMatch[1])}</b></div>`;
    }

    html += `
      <div class="stop ${isDone?'done':''}" data-stop="${k}">
        <div class="stop-line"><div class="stop-dot">${i+1}</div><div class="stop-connector"></div></div>
        <div class="stop-card" data-stop-card="${k}">
          <div class="stop-time">${escapeHtml(s.time)}</div>
          ${s.title ? `<div class="stop-title">${escapeHtml(s.title)}</div>` : ""}
          ${s.place ? `<div class="stop-place">📍 ${escapeHtml(s.place)}</div>` : ""}
          ${resHtml}
          ${s.desc ? `<div class="stop-desc">${escapeHtml(s.desc)}</div>` : ""}
          ${candHtml}
          ${btnHtml}
        </div>
      </div>`;
    if(i < day.stops.length - 1){
      html += renderLegPicker(activeDay, i, day.legs && day.legs[i]);
    }
  });
  const timelineEl = document.getElementById('timeline');
  timelineEl.innerHTML = html;

  timelineEl.querySelectorAll('[data-stop-card]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-cand], [data-stop-btn]')) return;
      const k = card.dataset.stopCard;
      checked[k] = !checked[k];
      localStorage.setItem('trip-checked', JSON.stringify(checked));
      renderAll();
    });
  });
  timelineEl.querySelectorAll('[data-cand]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      e.stopPropagation();
      const ck = chip.dataset.cand;
      const ci = +chip.dataset.ci;
      mealPicks[ck] = (mealPicks[ck] === ci) ? null : ci;
      localStorage.setItem('trip-meals', JSON.stringify(mealPicks));
      renderAll();
    });
  });
  timelineEl.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const text = btn.dataset.copy;
      const done = ()=>{
        const original = btn.textContent;
        btn.textContent = '✅ 복사됨';
        btn.classList.add('copied');
        setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=>{ prompt('아래 텍스트를 직접 복사하세요:', text); });
      } else {
        prompt('아래 텍스트를 직접 복사하세요:', text);
      }
    });
  });
  timelineEl.querySelectorAll('.leg-mode').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.disabled) return;
      const lk = btn.dataset.legkey;
      legPicks[lk] = btn.dataset.mode;
      localStorage.setItem('trip-legmode', JSON.stringify(legPicks));
      renderAll();
    });
  });

  gOverlays.forEach(o=>o.setMap(null)); gOverlays = [];
  const bounds = new google.maps.LatLngBounds();
  const pathCoords = [];
  const JAPAN_MIN_LNG = 128; // 이보다 서쪽(한국 인천공항 등)은 지도 범위/마커에서 제외

  day.stops.forEach((s,i)=>{
    if(Number.isFinite(s.lat) && Number.isFinite(s.lng) && s.lng >= JAPAN_MIN_LNG){
      const pos = {lat:s.lat, lng:s.lng};
      pathCoords.push(pos);
      bounds.extend(pos);
      gOverlays.push(new google.maps.Marker({position:pos, map, label:{text:String(i+1), color:'white'}}));
    } else {
      pathCoords.push(null);
    }
  });

  for(let i=0; i<pathCoords.length-1; i++){
    const a = pathCoords[i], b = pathCoords[i+1];
    if(!a || !b) continue;
    const lk = `${activeDay}-${i}`;
    const legData = day.legs && day.legs[i];
    const available = legData ? Object.keys(legData).filter(m => legData[m]) : [];
    const picked = legPicks[lk] && available.includes(legPicks[lk]) ? legPicks[lk] : available[0];
    if(picked && legData[picked] && legData[picked].poly && google.maps.geometry){
      const path = google.maps.geometry.encoding.decodePath(legData[picked].poly);
      gOverlays.push(new google.maps.Polyline({ path, map, strokeColor:'#BE4A3C', strokeOpacity:0.75, strokeWeight:4 }));
    } else {
      gOverlays.push(new google.maps.Polyline({
        path:[a,b], map, strokeOpacity:0,
        icons:[{icon:{path:'M 0,-1 0,1', strokeOpacity:.6, scale:3, strokeColor:'#BE4A3C'}, offset:'0', repeat:'10px'}]
      }));
    }
  }

  if(day.stops.length > 0 && !bounds.isEmpty()) map.fitBounds(bounds);
  const firstValid = pathCoords.find(Boolean);
  if(firstValid) fetchWeather(firstValid.lat, firstValid.lng, getDayDateStr(day.dayLabel));
}
