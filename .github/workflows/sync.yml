name: 여행 일정 자동 동기화

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시트 동기화 실행
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python sync_sheet.py

      - name: 변경사항 있으면 자동 커밋 & 푸시
        run: |
          git config user.name "trip-sync-bot"
          git config user.email "trip-sync-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "자동 일정 동기화 $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin main --force
          fi
